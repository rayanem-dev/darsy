<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darsy+</title>
<link rel="manifest" href="manifest.json?v=2026.10.15.1">
<meta name="theme-color" content="#3b5bdb">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2026.10.15.1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2026.10.15.1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2026.10.15.1">
<link rel="stylesheet" href="basdepage.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darsy+">
<style>
  :root{--k-0f1220:#0f1220;--k-1f2a55:#1f2a55;--k-232a45:#232a45;--k-2d3a9c:#2d3a9c;--k-3352c9:#3352c9;--k-3b5bdb:#3b5bdb;--k-5c7cfa:#5c7cfa;--k-7048e8:#7048e8;--k-748ffc:#748ffc;--k-7b93ff:#7b93ff;--k-91a7ff:#91a7ff;--k-a5b4fc:#a5b4fc;--k-a9d0f5:#a9d0f5;--k-b8c4ff:#b8c4ff;--k-cdbdf3:#cdbdf3;--k-dbe4ff:#dbe4ff;--k-e6ebfb:#e6ebfb;--k-e7ecff:#e7ecff;--k-e9edfb:#e9edfb;--k-eceef5:#eceef5;--k-edf2ff:#edf2ff;--k-eef1fb:#eef1fb;--k-f3f6ff:#f3f6ff;--k-f4f6ff:#f4f6ff;--k-f5f6fa:#f5f6fa;--pri-rgb:59,91,219;--pri2-rgb:112,72,232;--bg:var(--k-f5f6fa);--card:#fff;--txt:#1f2430;--mut:#6b7385;--pri:var(--k-3b5bdb);--ok:#2f9e44;--warn:#e8590c;--ko:#c92a2a;--bd:#e3e6ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{background:var(--pri);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  header h1{margin:0;font-size:18px}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
  nav button{flex:1;padding:12px 4px;border:0;background:none;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
  nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
  main{max-width:1240px;margin:0 auto;padding:14px clamp(12px,2.5vw,32px);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{margin:0;font-size:19px}
  .sub{color:var(--mut);font-size:13px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .course{border-top:1px solid var(--bd);margin-top:12px;padding-top:12px}
  .course h3{margin:0;font-size:16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
  .stat b{display:block;font-size:14px}
  .stat span{font-size:11px;color:var(--mut)}
  .due{color:var(--warn)} .ok{color:var(--ok)}
  .row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
  .row:first-child{border-top:0}
  .grow{flex:1;min-width:0}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);white-space:nowrap}
  .badge.Faite,.badge.Payé{background:#d3f9d8;color:#2b8a3e}
  .badge.Offert,.badge.Gratuit{background:#f3d9fa;color:#9c36b5}
  .badge.Annulée,.badge.Impayé{background:#ffe3e3;color:var(--ko)}
  .badge.Reportée,.badge.Partiel{background:#fff3bf;color:#e67700}
  .badge.Prévue{background:var(--k-dbe4ff);color:var(--pri)}
  .badge.Ratée{background:#ffe8cc;color:#d9480f}
  button.b{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
  button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
  button.d{color:var(--ko);border-color:#f3c4c4}
  button.i{padding:4px 8px}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  input[type=checkbox],input[type=radio]{width:auto}
  .filters input,.filters select{width:auto;flex:1;min-width:130px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--txt);margin:8px 0;cursor:pointer}
  label.chk input{width:22px;height:22px;flex:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal.hidden{display:none}
  .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}.box{border-radius:16px}}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days label{display:flex;align-items:center;gap:4px;margin:0;font-size:14px;color:var(--txt);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
  .empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g2b{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd)}
  th:first-child,td:first-child{text-align:left}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{border-radius:12px;padding:14px;color:#fff}
  .kpi.a{background:linear-gradient(135deg,var(--k-3b5bdb),var(--k-5c7cfa))}
  .kpi.b{background:linear-gradient(135deg,#e8590c,#f76707)}
  .kpi.c{background:linear-gradient(135deg,#2f9e44,#40c057)}
  .kpi.d{background:linear-gradient(135deg,#ae3ec9,#be4bdb)}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:12px;opacity:.9}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
  .cal .dow{font-size:11px;color:var(--mut);text-align:center;padding:2px 0}
  .cal .day{min-height:66px;background:var(--bg);border-radius:6px;padding:2px;cursor:pointer;overflow:hidden}
  .cal .day.out{background:transparent;cursor:default}
  .cal .day.today{outline:2px solid var(--pri);background:var(--k-edf2ff)}
  .cal .num{font-size:11px;color:var(--mut);text-align:right;padding:0 2px}
  .chip{font-size:10px;line-height:1.25;padding:2px 3px;border-radius:4px;margin-top:2px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .chip.Annulée,.chip.Reportée{opacity:.5;text-decoration:line-through}
  .chip.Ratée{opacity:.65;border-left-style:dashed}
  .chip.late{box-shadow:0 0 0 1.5px var(--warn)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .install{display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#1A1A2E,var(--k-3b5bdb));color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .install .em{font-size:22px}
  .install .txt{flex:1;font-size:12.5px;line-height:1.4}
  .install .txt b{display:block;font-size:13.5px}
  .install button{border:0;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .install .go{background:#fff;color:var(--pri)}
  .install .close{background:transparent;color:rgba(255,255,255,.8);padding:8px}
  .avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .crumbs{padding:2px 2px 10px;font-size:13px;color:var(--mut);word-break:break-word}
  .crumbs a{color:var(--pri);cursor:pointer;text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
  /* ---------- Emploi du temps ---------- */
  .emploi-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
  table.emploi{border-collapse:separate;border-spacing:0;width:100%;min-width:520px;table-layout:fixed;font-size:11px;margin:0;border:1.5px solid #2b2f3a;border-radius:8px;overflow:hidden}
  table.emploi th,table.emploi td{border:1px solid #9aa1b2;padding:3px 4px;vertical-align:middle;text-align:center;overflow-wrap:break-word;word-break:break-word;line-height:1.25}
  table.emploi th{background:#fff;position:sticky;top:0;z-index:2;font-size:13px;padding:6px 2px;border-bottom:1.5px solid #2b2f3a}
  table.emploi th:first-child,table.emploi td.heure{position:sticky;left:0;z-index:1;background:#fff;width:54px;font-weight:700;font-size:10px;color:#2b2f3a;box-shadow:2px 0 4px -2px rgba(0,0,0,.15)}
  table.emploi th:first-child{z-index:3}
  table.emploi td.slot{font-weight:500;padding:3px 3px;cursor:default}
  table.emploi td.slot.ecole{cursor:pointer}
  table.emploi td.multi{padding:2px;vertical-align:top}
  table.emploi .cell{border-radius:5px;padding:3px 4px;margin:1px 0;font-size:10.5px;font-weight:500}
  table.emploi .ic{font-size:13px;vertical-align:-1px}
  table.emploi .kid{font-size:9px;opacity:.7}
  .cat-fr{background:#f4b6c0}.cat-maths{background:var(--k-a9d0f5)}.cat-eps{background:#f5bb80}.cat-art{background:#f7e46e}
  .cat-monde{background:#aeeedb}.cat-lv{background:var(--k-cdbdf3)}.cat-rituel{background:#e4e4e8}.cat-emc{background:#fbdfae}
  .cat-pause{background:#fff;color:#3d4250;letter-spacing:.3px}.cat-autre{background:var(--k-e6ebfb)}
  .cat-priv{background:#fff3e0;box-shadow:inset 3px 0 0 #e8590c}
  .volume{margin-top:12px;border:1.5px solid #2b2f3a;border-radius:10px;padding:8px 10px}
  .volume h3{margin:0 0 6px;font-size:12px}
  .volume .pills{display:flex;flex-wrap:wrap;gap:6px}
  .volume .pill{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid rgba(0,0,0,.12)}
  table.emploi td.heure span{display:block}
  .print-header,.print-only{display:none}
  @media print{
    @page{size:landscape;margin:7mm}
    header,nav#tabs,#modal,.install{display:none!important}
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #app>.card{display:none!important}
    #app>.card.grid-print{display:block!important;border:0;box-shadow:none;padding:0;margin:0;animation:none}
    .grid-print .noprint{display:none!important}
    .print-header{display:block!important;text-align:center;margin-bottom:6px}
    .print-header h1{display:inline-block;margin:0;font-size:15pt;border:1.5px solid #2b2f3a;border-radius:10px;padding:3px 18px}
    .print-header .print-sub{margin-top:3px;font-size:8.5pt;color:var(--mut)}
    .emploi-wrap{overflow:visible}
    table.emploi{min-width:0;font-size:6.8pt;border-radius:0;table-layout:fixed}
    table.emploi th,table.emploi td.heure{position:static;box-shadow:none}
    table.emploi th{font-size:9pt;padding:2px}
    table.emploi th,table.emploi td{padding:.4px 2px;line-height:1.08}
    table.emploi td.heure{font-size:6.2pt;width:23mm;white-space:nowrap;padding:.4px 1px}
    table.emploi td.heure span{display:inline}
    table.emploi td.heure span+span::before{content:' – '}
    table.emploi .cell{padding:.5px 3px;margin:.3px 0;font-size:6.6pt}
    table.emploi .kid{display:none}
    table.emploi .ic{display:none}
    .volume{margin-top:6px;padding:4px 8px;break-inside:avoid}
    .volume .pill{font-size:7.5pt;padding:1px 7px}
    table,tr,td,th{page-break-inside:avoid}
  }

  /* ---------- Look général ---------- */
  header{background:linear-gradient(135deg,var(--k-3b5bdb),var(--k-7048e8));box-shadow:0 2px 10px rgba(var(--pri-rgb),.25)}
  header h1{letter-spacing:.2px}
  nav{overflow-x:auto;scrollbar-width:none;box-shadow:0 1px 6px rgba(0,0,0,.05)}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;font-size:12px;transition:color .2s,border-color .2s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:7px 2px 6px;min-width:0}
  nav button .ni{font-size:18px;line-height:1.15}
  nav button .nt{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  @media(min-width:720px){nav{justify-content:center}nav button{flex:0 1 150px;flex-direction:row;gap:8px;font-size:14px;padding:11px 14px}nav button .ni{font-size:17px}}
  nav button:hover{background:var(--k-f4f6ff)}
  .card{border-radius:16px;border-color:transparent;box-shadow:0 1px 3px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.05)}
  button.b{transition:transform .12s,box-shadow .12s,background .2s;font-weight:500}
  button.b:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
  button.b:active{transform:scale(.96)}
  button.p:hover{background:var(--k-3352c9)}
  .badge{font-weight:600}
  .cal .day{transition:background .15s}
  .cal .day:not(.out):hover{background:var(--k-e9edfb)}
  .row{transition:background .15s}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes ringin{from{stroke-dashoffset:var(--c)}}
  @keyframes barin{from{transform:scaleX(0)}}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  #app.enter>*{animation:fadeup .4s ease both}
  #app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}
  #app.enter .rf{animation:ringin 1.1s cubic-bezier(.3,.7,.2,1) both}
  #app.enter .bar>i{animation:barin .9s cubic-bezier(.3,.7,.2,1) both}
  #app.enter .wk i{animation:barin .7s ease both;transform-origin:bottom}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Accueil : jauges ---------- */
  .hello{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
  .hello .hi-ic{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
  .hello .hi{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .hello .hi small{color:var(--mut);font-size:13px}
  .hello .hi b{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hello .dt{color:var(--mut);font-size:12.5px;text-transform:capitalize;text-align:end;flex:none;width:max-content;white-space:nowrap;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 10px}
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
  @media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .tile{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.05);display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .tile.wide{grid-column:1/-1;align-items:stretch;text-align:left}
  .tile .lbl{font-size:12px;color:var(--mut)}
  .tile .big{font-size:24px;font-weight:800}
  .tile .hint{font-size:12px;color:var(--mut)}
  .tile.money{background:linear-gradient(135deg,var(--k-3b5bdb),var(--k-7048e8));color:#fff}
  .tile.money .lbl,.tile.money .hint{color:rgba(255,255,255,.85)}
  .tile.money.ok{background:linear-gradient(135deg,#2f9e44,#51cf66)}
  .tile.money.prev{background:linear-gradient(135deg,#f76707,#ffa94d)}
  .tile.reste{grid-column:1/-1}
  @media(min-width:760px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}.tile.reste{grid-column:auto}}
  .ring{width:88px;height:88px}
  .ring .rb{fill:none;stroke:var(--k-eceef5);stroke-width:8}
  .ring .rf{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .ring text{font-size:17px;font-weight:800;fill:var(--txt)}
  .wk{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:6px}
  .wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--mut)}
  .wk .col{width:100%;max-width:26px;flex:1;background:var(--k-eef1fb);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
  .wk .col i{display:block;width:100%;background:linear-gradient(180deg,var(--k-5c7cfa),var(--k-3b5bdb));border-radius:6px}
  .wk .today b{color:var(--pri)}
  .wk .today .col{outline:2px solid var(--pri)}
  .bar{height:9px;background:var(--k-eceef5);border-radius:99px;overflow:hidden;margin:4px 0}
  .bar>i{display:block;height:100%;border-radius:99px;transform-origin:left;background:linear-gradient(90deg,var(--k-5c7cfa),var(--k-3b5bdb))}
  .bar.ok>i{background:linear-gradient(90deg,#51cf66,#2f9e44)}
  .bar.warn>i{background:linear-gradient(90deg,#ffa94d,#e8590c)}
  .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
  .bl b{color:var(--txt)}

  /* ---------- Mise en page adaptative ---------- */
  .split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
  @media(min-width:1000px){.split{grid-template-columns:minmax(0,1fr) 380px}.split aside{position:sticky;top:64px}}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .cgrid>.card,.grid>.card{margin-bottom:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));column-gap:28px}
  .cols .row{border-top:0;border-bottom:1px solid var(--bd)}
  .filters select,.filters input{max-width:340px}
  @media(min-width:900px){.cal .day{min-height:96px}.chip{font-size:11px}}
  .who{display:flex;align-items:center;gap:10px;margin:18px 2px 10px}
  .who:first-child{margin-top:4px}
  .who h2{margin:0;font-size:19px}
  .who .grow{min-width:0}
  /* ---------- Fiche cours (accueil) ---------- */
  .cc{padding:14px;border-left:5px solid var(--cc,var(--k-3b5bdb));display:flex;flex-direction:column;gap:8px}
  .cc.pending{border-left-color:var(--warn)}
  .cc.paid{border-left-color:var(--ok)}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ctitle{font-size:16px}
  .tl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:2px 0}
  .tl span{color:var(--mut)}.tl b{text-align:right;font-weight:600}
  .seg{display:flex;height:11px;background:var(--k-eceef5);border-radius:99px;overflow:hidden}
  .seg i{display:block;height:100%;transform-origin:left}
  .seg .d{background:linear-gradient(90deg,#51cf66,#2f9e44)}
  .seg .p{background:repeating-linear-gradient(45deg,var(--k-91a7ff),var(--k-91a7ff) 5px,var(--k-748ffc) 5px,var(--k-748ffc) 10px)}
  .wait,.okb{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 11px}
  .wait{background:#fff4e6;border:1.5px solid #ffa94d;animation:pulse 1.8s ease-out infinite}
  .wait b{color:#d9480f}.wait .grow{min-width:0;font-size:13px}
  .wait .sub{color:#a5561a}
  .okb{background:#ebfbee;color:#2b8a3e;font-weight:600;font-size:13px}
  .pdot{width:12px;height:12px;border-radius:50%;background:var(--warn);flex:none;animation:blink 1.2s ease-in-out infinite}

/* Thèmes de couleurs : la couleur d'origine (indigo) est tournée vers une autre teinte ; tout le site suit (variables --k-xxxxxx). */
var PALETTE=(function(){
  var BASE=["0f1220", "1f2a55", "232a45", "2d3a9c", "3352c9", "3b5bdb", "5c7cfa", "7048e8", "748ffc", "7b93ff", "91a7ff", "a5b4fc", "a9d0f5", "b8c4ff", "cdbdf3", "dbe4ff", "e6ebfb", "e7ecff", "e9edfb", "eceef5", "edf2ff", "eef1fb", "f3f6ff", "f4f6ff", "f5f6fa"];
  var LISTE=[['indigo','Indigo',228,1],['ocean','Océan',188,1],['foret','Forêt',142,.9],['rose','Rose',334,1],['ardoise','Ardoise',215,.3]];
  function rgb(h){return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];}

  function hex(c){return c.map(function(v){var n=Math.max(0,Math.min(255,Math.round(v*255))).toString(16);return n.length<2?'0'+n:n;}).join('');}
  function rot(h6,cible,sf){var x=toHsl(rgb(h6));return hex(toRgb((x[0]-228+cible+720)%360,Math.min(1,x[1]*sf),x[2]));}
  function def(id){for(var i=0;i<LISTE.length;i++)if(LISTE[i][0]===id)return LISTE[i];return LISTE[0];}

="translate(386,208) rotate(-34)" d="M0 0 Q20.7 -18.4 46.0 0 Q20.7 18.4 0 0Z" fill="url(#lfh)"/><path transform="translate(386,204) rotate(-104)" d="M0 0 Q18.9 -16.8 42.0 0 Q18.9 16.8 0 0Z" fill="url(#lfh)"/><path transform="translate(398,176) rotate(-50)" d="M0 0 Q18.9 -16.8 42.0 0 Q18.9 16.8 0 0Z" fill="url(#lfh)"/><path transform="translate(398,172) rotate(-110)" d="M0 0 Q18.0 -16.0 40.0 0 Q18.0 16.0 0 0Z" fill="url(#lfh)"/><path transform="translate(404,146) rotate(-62)" d="M0 0 Q18.0 -16.0 40.0 0 Q18.0 16.0 0 0Z" fill="url(#lfh)"/><path transform="translate(404,142) rotate(-112)" d="M0 0 Q17.1 -15.2 38.0 0 Q17.1 15.2 0 0Z" fill="url(#lfh)"/><path transform="translate(404,124) rotate(-90)" d="M0 0 Q22.5 -20.0 50.0 0 Q22.5 20.0 0 0Z" fill="url(#lfh)"/></g></svg></span><h1>Darsy+</h1><button class="aide" id="bt-theme" onclick="openTheme()" title="Thème de couleurs" aria-label="Thème de couleurs">🎨</button><button class="aide" id="bt-set" onclick="tab='set';render()" title="Réglages" aria-label="Réglages">⚙</button><button class="aide" onclick="openAide()" title="Aide" aria-label="Aide">?</button><button class="aide" id="bt-out" onclick="confirmLogout()" title="Se déconnecter" aria-label="Se déconnecter" style="display:none">🚪</button></header>

<script>
var DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbztgTfXpHNmpSmF4wXVNbv7LqFXVeSNW2N08xux8FYyjLW_jhjolPIxQTBDjHbAFU_1/exec';
var APP_VERSION='2026.10.15.1';
// Version MINIMALE du serveur (Code.gs) dont ce site a besoin (reprogrammation des séances, gestes, horaire par séance…).
// À relever quand une nouveauté dépend du serveur ; sous cette version, un avertissement s'affiche en haut de l'appli.
var MIN_SERVER='2026.10.15.1';
var D = {enfants:[], cours:[], seances:[], paiements:[], ecole:[], config:{emailPere:'',emailMere:'',emailChauffeur:'',veille:false,matin:false,uneHeure:false,ecoleAgenda:false,ecoleAlerte:false,rappelFin:true,alertePaiement:true}};
var tab = 'home', fCours = '', fMonth = today().slice(0,7), bEdited = false;
var STAT = ['Prévue','Faite','Ratée','Annulée','Reportée'];
// Une séance "Ratée" = absence non rattrapable : elle est consommée dans la session (elle compte parmi les N cours), sans être remplacée.
function compteSession(x){return x.Statut==='Faite'||x.Statut==='Prévue'||x.Statut==='Ratée';}
var DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam']; // la semaine commence le dimanche
var DOW = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var PAL = ['var(--k-3b5bdb)','#e8590c','#2f9e44','#ae3ec9','#0c8599','#c2255c'];
var TABS = [['home','Accueil','🏠'],['seances','Séances','✅'],['sessions','Sessions','🗂️'],['paie','Paiements','💳'],['cal','Calendrier','📅'],['sujet','Sujets','📝']]; // Réglages : engrenage dans l'en-tête
// (Aucune photo par défaut : seules les photos téléversées par l'utilisateur lui-même (📷 Changer la photo) sont affichées.)

function p2(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return iso(new Date());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return (Number(n)||0).toLocaleString(I18N.locale())+' DA';}
function fd(s){var d=new Date(String(s).slice(0,10)+'T00:00');return isNaN(d)?s:d.toLocaleDateString(I18N.locale(),{weekday:'short',day:'numeric',month:'short'});}
function fs(s){var d=new Date(String(s).slice(0,10)+'T00:00');return isNaN(d)?s:d.toLocaleDateString(I18N.locale(),{day:'numeric',month:'short'});}
function v(id){return document.getElementById(id).value;}
function same(a,b){return String(a)===String(b);}
var IDX=null, CY={};
function setD(d){
  // Les séances supprimées vont dans la corbeille (restaurables) et n'apparaissent plus ailleurs.
  var all=d.seances||[];
  d.corbeille=all.filter(function(x){return x.Statut==='Supprimée';});
  d.seances=all.filter(function(x){return x.Statut!=='Supprimée';});
  D=d;IDX=null;CY={};
}
function idx(){
  if(!IDX){
    IDX={enf:{},crs:{},ses:{}};
    D.enfants.forEach(function(e){IDX.enf[String(e.ID)]=e;});
    D.cours.forEach(function(c){IDX.crs[String(c.ID)]=c;});
    D.seances.forEach(function(x){IDX.ses[String(x.ID)]=x;});
  }
  return IDX;
}
function enf(id){return idx().enf[String(id)]||{Nom:'?'};}
function crs(id){return idx().crs[String(id)]||{Matiere:'?',PrixMois:0,SeancesMois:8};}
function seance(id){return idx().ses[String(id)];}
function cname(c){return enf(c.EnfantID).Nom+' — '+c.Matiere+(c.Prof?' ('+c.Prof+')':'');}
// Emplacement du cours : lien Google Maps (ou lien collé tel quel) sur l'adresse / la salle.
function lieuHtml(c){
  var l=c&&c.Lieu?String(c.Lieu).trim():'';
  if(!l)return '';
  var url=/^https?:\/\//i.test(l);
  var href=url?l:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l);
  return ' · <a class="lieu" href="'+esc(href)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 '+(url?'Lieu':esc(l))+'</a>';
}
// Horaire PROPRE à une séance (Sessions.Heure) : prioritaire sur l'horaire habituel du cours.
function heureS(s){return String((s&&s.Heure)||(s&&crs(s.CoursID).Heure)||'').trim();}
function choraireS(s){
  if(!s||!s.Heure)return choraire(crs(s&&s.CoursID));
  return ' · <span class="hmod" title="Horaire modifié pour cette séance">'+esc(s.Heure)+'</span>'+lieuHtml(crs(s.CoursID));
}
function choraire(c){return (c&&c.Heure?' · '+esc(c.Heure):'')+lieuHtml(c);}
function ccol(eid){var i=D.enfants.findIndex(function(e){return same(e.ID,eid);});return PAL[(i<0?0:i)%PAL.length];}
function dowName(s){return DOW[new Date(s+'T00:00').getDay()];}
function avatarImg(e){
  var photo=e.Photo;
  if(photo)return '<img src="'+photo+'" alt="" loading="lazy">';
  return esc((e.Nom||'?').charAt(0).toUpperCase());
}

// Icônes par matière (reconnues par mot-clé, insensible à la casse)
var SUBJ_ICONS = [
  [['math','maths','mathematique','mathématique','الرياضيات'],'🧮'],
  [['philo','philosophie','فلسفة'],'🏛️'],
  [['arabe','عربية'],'📗'],
  [['anglais','english','انجليزية','إنجليزية'],'📘'],
  [['francais','français','french','فرنسية'],'📙'],
  [['sport','eps','education physique','éducation physique','تربية بدنية'],'⚽'],
  [['islamique','education islamique','éducation islamique','اسلامية','إسلامية'],'🕌'],
  [['physique','الفيزياء'],'🧲'],
  [['chimie','كيمياء'],'🧪'],
  [['science','svt','biologie','طبيعية'],'🔬'],
  [['histoire','geo','géo','geographie','géographie','تاريخ','جغرافيا'],'🗺️'],
  [['musique'],'🎵'],
  [['informatique','info','code','programmation'],'💻'],
  [['dessin','art'],'🎨']
];
function subjNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function subjIcon(mat){
  var n=subjNorm(mat);
  for(var i=0;i<SUBJ_ICONS.length;i++){
    var kws=SUBJ_ICONS[i][0];
    for(var j=0;j<kws.length;j++){if(n.indexOf(subjNorm(kws[j]))>=0)return SUBJ_ICONS[i][1];}
  }
  return '📖';
}
function subjIconBig(mat){return '<span style="font-size:19px;vertical-align:-3px;display:inline-block">'+subjIcon(mat)+'</span>';}

// --- Session (comptes) : un jeton signé par le serveur, gardé sur l'appareil ---
var TOKEN='', ME=null, LEGACY_MODE=false, DURABLE=true; // DURABLE : « Rester connecté » (localStorage) ou session courte (sessionStorage)
try{TOKEN=sessionStorage.getItem('darsy_token')||'';if(TOKEN)DURABLE=false;else TOKEN=localStorage.getItem('darsy_token')||'';}catch(e){}
function saveToken_(t,durable){
  if(durable!==undefined)DURABLE=!!durable;
  TOKEN=t||'';
  try{localStorage.removeItem('darsy_token');sessionStorage.removeItem('darsy_token');if(t)(DURABLE?localStorage:sessionStorage).setItem('darsy_token',t);}catch(e){}
  majSortie_();
}
function majSortie_(){var b=document.getElementById('bt-out');if(b)b.style.display=(TOKEN&&!LEGACY_MODE)?'':'none';}
function confirmLogout(){if(confirm('Se déconnecter ?'))logout();}
function restCheck_(){try{return localStorage.getItem('darsy_rester')!=='0';}catch(e){return true;}}
function resData_(res){
  if(res.ok)return res.data;
  var m=String(res.error||'Erreur serveur');
  if(/^AUTH/.test(m)&&!LEGACY_MODE)sessionPerdue_();
  var err=new Error(m.replace(/^(AUTH|LICENCE):\s*/,''));
  if(/^LICENCE/.test(m))err.licence=true;
  throw err;
}
function apiUrl(){return (localStorage.getItem('cours_api_url')||'').trim()||DEFAULT_API_URL;}
function setApiUrl(u){localStorage.setItem('cours_api_url', (u||'').trim());}
function apiCall(fn, args){
  var base=apiUrl();
  if(!base)return Promise.reject(new Error('URL API non configurée. Va dans Réglages pour la renseigner.'));
  var sep=base.indexOf('?')>=0?'&':'?';
  var url=base+sep+'api='+encodeURIComponent(fn)+'&args='+encodeURIComponent(JSON.stringify(args||[]))+(TOKEN?'&t='+encodeURIComponent(TOKEN):'');
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(resData_);
}
var Q=Promise.resolve(), pendingCalls=0;
function busy_(on){document.getElementById('app').style.opacity=on?.5:1;}
// Les écritures sont exécutées l'une après l'autre (évite les courses sur la feuille),
// et seul le résultat de la dernière met à jour l'écran.
function call(fn){
  var args=[].slice.call(arguments,1);
  formDirty=false; // action explicite de l'utilisateur (Enregistrer…) : l'écran peut être rafraîchi
  return callQ_(fn,args,false);
}
function callQ_(fn,args,quiet){
  pendingCalls++;
  if(!quiet)busy_(true);
  Q=Q.then(function(){return apiCall(fn,args);}).then(function(data){
    pendingCalls--;
    if(!pendingCalls){setD(data);cacheData();busy_(false);safeRender();}
  },function(e){
    pendingCalls--;
    if(!pendingCalls)busy_(false);
    alert(e.message||e);
    if(!pendingCalls)boot();
  });
  return Q;
}
function cacheData(){if(ME&&ME.support)return;try{localStorage.setItem('cours_data_cache',JSON.stringify(D));}catch(e){}}
// Envoi en POST (Content-Type text/plain pour éviter le préflight CORS que les Web Apps
// Apps Script ne gèrent pas). Utilisé uniquement pour l'upload de photo : le payload
// base64 est trop volumineux pour tenir dans une URL (limite ~getData en GET).
function apiPost(fn,args){
  var base=apiUrl();
  if(!base)return Promise.reject(new Error('URL API non configurée. Va dans Réglages pour la renseigner.'));
  return fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:fn,args:args||[],t:TOKEN})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(resData_);
}
// Redimensionne/compresse la photo dans le navigateur avant envoi (évite d'envoyer
// une photo de téléphone de plusieurs Mo pour un simple avatar rond).
function resizeImage(file,maxSize,quality){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height;
        if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize;}}
        else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize;}}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality||0.82));
      };
      img.onerror=function(){reject(new Error('Image illisible'));};
      img.src=ev.target.result;
    };
    reader.onerror=function(){reject(new Error('Lecture du fichier impossible'));};
    reader.readAsDataURL(file);
  });
}
function uploadEnfantPhoto(input,id){
  var file=input.files&&input.files[0];
  if(!file)return;
  document.getElementById('app').style.opacity=.5;
  resizeImage(file,480,0.82).then(function(dataUrl){
    return apiPost('saveEnfantPhoto',[id,dataUrl]);
  }).then(function(data){
    setD(data);cacheData();document.getElementById('app').style.opacity=1;render();
  }).catch(function(e){
    document.getElementById('app').style.opacity=1;alert(e.message||e);
    input.value='';
  });
}

function addDays(s,n){var p=s.split('-').map(Number);return iso(new Date(p[0],p[1]-1,p[2]+n));}
function addMonth(s,n){
  var p=s.split('-').map(Number), last=new Date(p[0],p[1]-1+n+1,0).getDate();
  return iso(new Date(p[0],p[1]-1+n,Math.min(p[2],last)));
}
function pstart(x){var m=String(x.Mois||x.Date).slice(0,10);return m.length===7?m+'-01':m;}

function cycles(c){
  var k=String(c.ID);
  return CY[k]||(CY[k]=cycles_(c));
}
// Une SESSION = un paquet de N séances (SeancesMois). Elle se termine le lendemain de sa N-ième séance
// (faite, prévue ou ratée). Une séance reportée/annulée n'est pas comptée : le remplacement prolonge la session.
// Une séance ratée (non rattrapable) occupe une place sans être remplacée : la session se clôt une séance plus tôt.
function sessionEnd(c,start,n){
  var ds=D.seances.filter(function(x){return same(x.CoursID,c.ID)&&compteSession(x)&&String(x.Date).slice(0,10)>=start;})
    .map(function(x){return String(x.Date).slice(0,10);}).sort();
  return ds.length>=n?addDays(ds[n-1],1):null;
}
function cycles_(c){
  var set={};
  D.paiements.forEach(function(x){if(same(x.CoursID,c.ID))set[pstart(x)]=1;});
  var ss=Object.keys(set).sort();
  if(!ss.length){
    var first=null;
    D.seances.forEach(function(x){
      if(same(x.CoursID,c.ID)&&compteSession(x)){var d=String(x.Date).slice(0,10);if(!first||d<first)first=d;}
    });
    if(!first)return [];
    ss=[first];
  }
  var r1=Number(c.Rattrapage)||0, N=Number(c.SeancesMois)||8, t=today(), starts=ss.slice();
  // Sessions suivantes déduites du nombre de séances (au-delà du dernier paiement connu), jusqu'à aujourd'hui.
  var cur=starts[starts.length-1], k=(starts.length===1&&r1>0)?r1:N;
  for(var g=0;g<60&&!isUnique(c);g++){
    var e=sessionEnd(c,cur,k);
    if(!e||e>t)break;
    starts.push(e);cur=e;k=N;
  }
  return starts.map(function(s,i){
    var last=i===starts.length-1;
    var cy={start:s,end:last?(sessionEnd(c,s,(i===0&&r1>0)?r1:N)||addMonth(s,1)):starts[i+1]};
    if(i===0){
      // 1re session : rattrapage éventuel + frais d'inscription (une seule fois, jamais récurrents)
      var fee=Number(c.FraisInscription)||0;
      if(r1>0){cy.rattrapage=true;cy.n=r1;}
      if(r1>0||fee>0){cy.fee=fee;cy.prix=(r1>0?prixRattrapage(c):(Number(c.PrixMois)||0))+fee;}
    }
    return cy;
  });
}
// Prix du 1er cycle (rattrapage) : celui saisi, sinon proportionnel au nombre de séances.
function prixRattrapage(c){
  var r1=Number(c.Rattrapage)||0, p=Number(c.PrixRattrapage)||0;
  if(p>0)return p;
  return Math.round((Number(c.PrixMois)||0)*r1/(Number(c.SeancesMois)||8));
}
// Prix du tout premier paiement d'un cours : (rattrapage ou mois) + frais d'inscription.
function premierPrix(c){
  if(isLibre(c))return 0;
  return (Number(c.Rattrapage)>0?prixRattrapage(c):(Number(c.PrixMois)||0))+(Number(c.FraisInscription)||0);
}
function curCycle(cys){
  var t=today();
  for(var i=0;i<cys.length;i++){if(cys[i].start<=t&&t<cys[i].end)return cys[i];}
  return cys.length?cys[cys.length-1]:null;
}
function cyStat(c,cy){
  var f=0,pr=0,ra=0,paye=0;
  D.seances.forEach(function(x){
    if(!same(x.CoursID,c.ID))return;
    var d=String(x.Date).slice(0,10);
    if(d<cy.start||d>=cy.end)return;
    if(x.Statut==='Faite')f++;else if(x.Statut==='Prévue')pr++;else if(x.Statut==='Ratée')ra++;
  });
  D.paiements.forEach(function(x){if(same(x.CoursID,c.ID)&&pstart(x)===cy.start)paye+=Number(x.Montant)||0;});
  // Cycle offert (ex. 1er cycle gratuit offert par le prof) : un paiement de 0 DA en mode "Offert" sur ce cycle.
  var offert=D.paiements.some(function(x){return same(x.CoursID,c.ID)&&pstart(x)===cy.start&&String(x.Mode||'').trim().toLowerCase()==='offert';});
  var libre=isLibre(c);
  var prix=(offert||libre)?0:(cy.prix!==undefined?cy.prix:(Number(c.PrixMois)||0));
  return {faites:f,prevues:pr,ratees:ra,paye:paye,prix:prix,reste:libre?0:prix-paye,offert:offert,libre:libre};
}
// Tarif libre : pas de prix fixe, seulement des gestes de remerciement ponctuels (jamais d'impayé ni d'alerte « à payer »).
function isLibre(c){return !!c&&(c.TarifLibre===1||c.TarifLibre===true||String(c.TarifLibre).toLowerCase()==='1'||String(c.TarifLibre).toLowerCase()==='true'||String(c.TarifLibre).toLowerCase()==='oui');}
// Session unique : un seul paquet de séances, qui ne se répète pas. Aucune session suivante n'est prévue
// (ni séances, ni rappel de paiement, ni montant « à prévoir ») ; seul le paiement de cette session reste suivi.
function isUnique(c){var v=String(c&&c.SessionUnique).toLowerCase();return v==='1'||v==='true'||v==='oui';}
function cStat(c){
  if(isLibre(c))return {due:0,paid:0,reste:0};
  var due=0,paid=0,reste=0;
  // Le reste se calcule session par session : un trop-perçu sur une session n'efface JAMAIS la dette d'une autre.
  cycles(c).forEach(function(cy){var s=cyStat(c,cy);due+=s.prix;paid+=s.paye;reste+=Math.max(s.prix-s.paye,0);});
  return {due:due,paid:paid,reste:reste};
}
function payBadge(s){
  if(s.libre)return 'Libre';
  if(s.offert)return 'Offert';
  if(s.prix<=0)return 'Gratuit';
  if(s.prix>0&&s.paye>=s.prix)return 'Payé';
  return s.paye>0?'Partiel':'Impayé';
}
function plabel(cy){return fs(cy.start)+' → '+fs(addDays(cy.end,-1));}
function weekBounds(t){
  var d=new Date(t+'T00:00'), dow=d.getDay(); // 0 = dimanche
  var start=addDays(t,-dow);
  return {start:start, end:addDays(start,7)};
}
// Règle : le paiement d'un cycle est dû le PREMIER JOUR DE COURS de ce cycle
// (premier jour habituel du cours à partir du début du cycle).
function firstDayOn(c,from){
  var days=String(c.Jours||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
  if(!days.length)return from;
  for(var i=0;i<14;i++){var d=addDays(from,i);if(days.indexOf(dowName(d))>=0)return d;}
  return from;
}
function payDay(c,cy){return firstDayOn(c,cy.end);}
function nextDue(c,cy){
  if(!cy)return null;
  var s=cyStat(c,cy);
  return s.reste<=0 ? payDay(c,cy) : cy.start;
}
// Début de période proposé pour un nouveau paiement : cycle impayé en cours, sinon 1er jour de la prochaine session.
function defaultPeriodStart(cid,d0){
  var c=crs(cid), cy=curCycle(cycles(c));
  if(!cy)return d0;
  return cyStat(c,cy).reste>0?cy.start:payDay(c,cy);
}
// Alertes de paiement (tous les cours payants) :
//  - cycle en cours impayé -> "late"
//  - sinon, à 7 jours du 1er jour de la prochaine session OU dès l'avant-dernière séance du cycle -> "soon"
// Montant déjà versé pour la PROCHAINE session (paiement anticipé, éventuellement partiel).
function payeProchaine(c,cy){
  return D.paiements.filter(function(p){return same(p.CoursID,c.ID)&&pstart(p)>=addDays(cy.end,-7);})
    .reduce(function(s,p){return s+(Number(p.Montant)||0);},0);
}
function payAlerts(){
  var t=today(), out=[];
  D.cours.forEach(function(c){
    if(isLibre(c))return;
    var cy=curCycle(cycles(c));if(!cy)return;
    var s=cyStat(c,cy);
    if(!(s.prix>0||Number(c.PrixMois)>0))return;
    if(s.reste>0){out.push({kind:'late',c:c,amount:s.reste,due:cy.start});return;}
    if(isUnique(c))return; // session unique : pas de session suivante
    var due=payDay(c,cy), n=daysTo(due);
    var restePro=Math.max((Number(c.PrixMois)||0)-payeProchaine(c,cy),0);
    if(restePro<=0)return; // prochaine session déjà payée
    var ds=D.seances.filter(function(x){var d=String(x.Date).slice(0,10);return same(x.CoursID,c.ID)&&compteSession(x)&&d>=cy.start&&d<cy.end;})
      .map(function(x){return String(x.Date).slice(0,10);}).sort();
    var pen=ds.length>=2?ds[ds.length-2]:null;
    if(n<=7||(pen&&t>=pen)){
      var nx=D.seances.filter(function(x){var d=String(x.Date).slice(0,10);return same(x.CoursID,c.ID)&&x.Statut==='Prévue'&&d>=t;})
        .map(function(x){return String(x.Date).slice(0,10);}).sort()[0];
      out.push({kind:'soon',c:c,amount:restePro,due:due,n:n,nextIsPay:!nx||nx>=due});
    }
  });
  return out.sort(function(a,b){return (a.kind==='late'?0:1)-(b.kind==='late'?0:1)||(a.due<b.due?-1:1);});
}
// Rappel doux (dans l'appli seulement) : à la fin d'une session d'un cours à tarif libre, penser à un geste.
// Une session est "réglée" dès qu'un paiement y est noté : un geste, ou 0 DA en mode « Aucun geste » (« Pas cette fois »).
function gesteReminders(){
  var t=today(), out={};
  D.cours.filter(isLibre).forEach(function(c){
    var cys=cycles(c);if(!cys.length)return;
    var cur=curCycle(cys), i=cys.indexOf(cur);
    [i-1,i].forEach(function(k){
      if(k<0||out[c.ID])return;
      var cy=cys[k];
      if(D.paiements.some(function(p){return same(p.CoursID,c.ID)&&pstart(p)===cy.start;}))return;
      var ended=cy.end<=t;
      if(ended&&daysTo(cy.end)<-21)return; // trop ancien : on ne harcèle pas
      var ds=D.seances.filter(function(x){var d=String(x.Date).slice(0,10);return same(x.CoursID,c.ID)&&compteSession(x)&&d>=cy.start&&d<cy.end;})
        .map(function(x){return String(x.Date).slice(0,10);}).sort();
      var pen=ds.length>=2?ds[ds.length-2]:null;
      if(ended||daysTo(cy.end)<=7||(pen&&t>=pen))out[c.ID]={c:c,cy:cy,n:k+1};
    });
  });
  return Object.keys(out).map(function(k){return out[k];});
}

function parseRange(s){
  var m=String(s||'').match(/(\d{1,2})\s*[h:]\s*(\d{2})?\s*-\s*(\d{1,2})\s*[h:]\s*(\d{2})?/);
  if(!m)return null;
  var st=(+m[1])*60+(+(m[2]||0)), en=(+m[3])*60+(+(m[4]||0));
  return en>st?{start:st,end:en}:null;
}
function fmtHM(m){return p2(Math.floor(m/60))+':'+p2(m%60);}
function fmtDur(m){var h=Math.floor(m/60),r=m%60;return h?(h+'h'+(r?p2(r)+"'":'')):(r+"'");}
// Catégories de matières (couleur + libellé), reconnues par mots-clés
var CATS=[
  ['pause','Pause',['recreation','pause','repas']],
  ['rituel','Rituels',['accueil','appel','rituel']],
  ['eps','Éducation physique et sportive',['eps','sport','education physique']],
  ['art','Enseignements artistiques',['musical','musique','plastique','dessin','arts']],
  ['monde','Questionner le monde',['questionner','monde','decouverte']],
  ['lv','Langues vivantes',['langue vivante','anglais','english','espagnol','allemand']],
  ['emc','Enseignement moral et civique',['emc','moral','civique','islamique']],
  ['maths','Mathématiques',['math','calcul','grandeur','resolution','probleme','geometrie','nombre','numeration']],
  ['fr','Français',['lecture','ecriture','dictee','grammaire','vocabulaire','redaction','graphem','francais','conjugaison','orthographe','copie','voix haute','comprehension','arabe']],
  ['priv','Cours particuliers',[]],
  ['autre','Autres',[]]
];
function catOf(mat){
  var n=subjNorm(mat);
  for(var i=0;i<CATS.length;i++){for(var j=0;j<CATS[i][2].length;j++){if(n.indexOf(CATS[i][2][j])>=0)return CATS[i][0];}}
  return 'autre';
}
var DAY_FULL={Lun:'Lundi',Mar:'Mardi',Mer:'Mercredi',Jeu:'Jeudi',Ven:'Vendredi',Sam:'Samedi',Dim:'Dimanche'};
var WEEK_GRID=DAYS; // dimanche → samedi

// Construit la grille : lignes = tranches horaires (toutes les heures de début/fin),
// colonnes = jours ; les créneaux consécutifs d'une même matière sont fusionnés (rowspan).
function buildGrille_(){
  var byDay={}, seen={};
  function put(day,it){if(day)(byDay[day]=byDay[day]||[]).push(it);}
  (D.ecole||[]).forEach(function(x){
    var r=parseRange(x.Horaire);if(!r)return;
    // Même classe pour les deux enfants : le créneau n'est affiché qu'une fois.
    var key=x.Jour+'|'+r.start+'|'+r.end+'|'+subjNorm(x.Matiere), kid=enf(x.EnfantID).Nom;
    if(seen[key]){seen[key].kids.push(kid);return;}
    seen[key]={kind:'ecole',id:x.ID,s:r.start,e:r.end,text:x.Matiere,icon:subjIcon(x.Matiere),cat:catOf(x.Matiere),kids:[kid]};
    put(x.Jour,seen[key]);
  });
  D.cours.forEach(function(c){
    var r=parseRange(c.Heure);if(!r)return;
    String(c.Jours||'').split(',').map(function(d){return d.trim();}).filter(Boolean).forEach(function(day){
      put(day,{kind:'cours',s:r.start,e:r.end,text:cname(c),icon:'📚',cat:'priv',kids:[]});
    });
  });
  var B=[];
  Object.keys(byDay).forEach(function(d){byDay[d].forEach(function(it){B.push(it.s,it.e);});});
  B=B.filter(function(v,i){return B.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  var rows=[];
  for(var i=0;i<B.length-1;i++){
    var covered=Object.keys(byDay).some(function(d){return byDay[d].some(function(it){return it.s<=B[i]&&it.e>=B[i+1];});});
    if(covered)rows.push({s:B[i],e:B[i+1]});
  }
  var days=WEEK_GRID.filter(function(d,i){return i<=4||(byDay[d]||[]).length;}); // Dim→Jeu toujours, Ven/Sam si utilisés
  var cells={};
  days.forEach(function(d){
    var its=(byDay[d]||[]).slice().sort(function(a,b){return a.s-b.s||a.e-b.e;}), cl=[];
    its.forEach(function(it){
      var last=cl[cl.length-1];
      if(last&&it.s<last.e){last.items.push(it);last.e=Math.max(last.e,it.e);}
      else cl.push({s:it.s,e:it.e,items:[it]});
    });
    cells[d]={};
    cl.forEach(function(c){
      var first=-1,n=0;
      rows.forEach(function(r,i){if(r.s>=c.s&&r.e<=c.e){if(first<0)first=i;n++;}});
      if(first>=0){c.rs=n;cells[d][first]=c;}
    });
  });
  var vol={};
  Object.keys(byDay).forEach(function(d){byDay[d].forEach(function(it){
    if(it.cat!=='pause')vol[it.cat]=(vol[it.cat]||0)+(it.e-it.s);
  });});
  return {rows:rows,days:days,cells:cells,vol:vol};
}

  var ic=(it.cat==='pause'||it.cat==='rituel')?'':'<span class="ic">'+it.icon+'</span> ';
  return ic+'<span dir="auto">'+esc(it.text)+'</span>'+kid;

function cellHtml_(c){
  var one=c.items.length===1, it=c.items[0];
  if(one)return '<td class="slot cat-'+it.cat+(it.kind==='ecole'?' ecole':'')+'" rowspan="'+c.rs+'"'
    +(it.kind==='ecole'?' onclick="openEcole(\''+it.id+'\')"':'')+'>'+itemInner_(it)+'</td>';
  return '<td class="slot multi" rowspan="'+c.rs+'">'+c.items.map(function(x){

function vGrilleEmploi(){
  var g=buildGrille_(), suggest=D.cours.some(function(c){return matchHoraire(c.Matiere)&&(!c.Jours||!c.Heure);});
  var head='<tr><th>Heure</th>'+g.days.map(function(d){return '<th>'+DAY_FULL[d]+'</th>';}).join('')+'</tr>';
  var skip={}, body='';
  if(!g.rows.length){
    body='<tr><td colspan="'+(g.days.length+1)+'"><div class="empty">Aucun créneau pour l\'instant.<br>Ajoute un créneau ou importe l\'emploi du temps du lycée.</div></td></tr>';
  }else g.rows.forEach(function(r,i){
    var tr='<tr><td class="heure"><span>'+fmtHM(r.s)+'</span><span>'+fmtHM(r.e)+'</span></td>';
    var first=g.cells[g.days[0]][i];

    if(allBreak)tr+='<td class="slot cat-pause" colspan="'+g.days.length+'">'+esc(first.items[0].text)+'</td>';
    else g.days.forEach(function(d){
      if(skip[d]>i)return;
      var c=g.cells[d][i];
      if(!c){tr+='<td></td>';return;}
      skip[d]=i+c.rs;
      tr+=cellHtml_(c);

    body+=tr+'</tr>';
  });
  var pills=CATS.filter(function(c){return g.vol[c[0]];}).map(function(c){

var SUBJ_HORAIRE = [
  [['science','svt','biologie'], 'Ven,Sam', '15:00-16:30'],
  [['physique'], 'Ven,Sam', '17:00-18:30'],
  [['musique'], 'Mar,Jeu', '17:00-18:30']

function matchHoraire(mat){
  var n=subjNorm(mat);
  for(var i=0;i<SUBJ_HORAIRE.length;i++){
    var kws=SUBJ_HORAIRE[i][0];
    for(var j=0;j<kws.length;j++){if(n.indexOf(subjNorm(kws[j]))>=0)return {jours:SUBJ_HORAIRE[i][1],heure:SUBJ_HORAIRE[i][2]};}
  }

}
function applyRentree(){

  if(!matches.length){alert('Aucun cours ne correspond à Science, Physique ou Musique.');return;}
  var msg='Appliquer ces horaires de rentrée ?\n\n'+matches.map(function(x){
    return '• '+cname(x.c)+' → '+x.h.jours.replace(/,/g,', ')+' · '+x.h.heure;
  }).join('\n');
  if(!confirm(msg))return;
  matches.forEach(function(x){call('saveCours',{ID:x.c.ID,Jours:x.h.jours,Heure:x.h.heure});});
}

// Paiements à prévoir pendant le mois du calendrier en cours : sessions déjà dues et non réglées,
// plus la prochaine session dont le premier jour de cours tombe ce mois-ci (cours à tarif libre exclus).
function prevuItems(){
  var t=today(), m=t.slice(0,7), out=[];
  D.cours.forEach(function(c){
    if(isLibre(c))return;
    var cy=curCycle(cycles(c));if(!cy)return;
    var s=cyStat(c,cy);
    if(!(s.prix>0||Number(c.PrixMois)>0))return;
    if(s.reste>0){out.push({c:c,amount:s.reste,due:cy.start,kind:'late'});return;}   // session en cours non réglée
    if(isUnique(c))return;                                                           // session unique : rien après
    var restePro=Math.max((Number(c.PrixMois)||0)-payeProchaine(c,cy),0);            // déduit ce qui est déjà payé
    if(restePro>0&&payDay(c,cy).slice(0,7)===m)out.push({c:c,amount:restePro,due:payDay(c,cy),kind:'soon'});
  });
  return out.sort(function(a,b){return (a.kind==='late'?0:1)-(b.kind==='late'?0:1)||(a.due<b.due?-1:1);});
}
function aPrevoirMois(){
  var l=prevuItems();
  return {total:l.reduce(function(s,x){return s+x.amount;},0),n:l.length,items:l};
}
function prevuTitle(l){

  var infos='<div class="sub">'+(c.Jours?esc(c.Jours):'jours non définis')+choraire(c)+' · '+fmt(c.PrixMois)+'/session'+(isUnique(c)?' · 🔂 session unique':'')+'</div>';
  if(!cur)return '<div class="card cc" style="--cc:'+col+'">'+head+'</div>'+infos
    +'<div class="sub" style="margin:8px 0">Aucune séance ni paiement pour l\'instant.</div>'+acts+'</div>';
  var t=today(), s=cyStat(c,cur), pending=s.prix>0?s.reste>0:false, od=-daysTo(cur.start), libre=isLibre(c);
  var due=payDay(c,cur), nDue=daysTo(due);
  // une pastille par séance de la session, QUEL QUE SOIT SON STATUT : faite (pleine), prévue (creuse),
  // ratée (rouge), reportée/annulée (barrée, non comptée), à planifier (pointillée)
  var win=D.seances.filter(function(x){var d=String(x.Date).slice(0,10);return same(x.CoursID,c.ID)&&d>=cur.start&&d<cur.end;})
    .sort(function(a,b){return String(a.Date)<String(b.Date)?-1:1;});
  var ds=win.filter(compteSession), dots='';
  win.forEach(function(x){
    var cl=x.Statut==='Faite'?'f':x.Statut==='Ratée'?'r':x.Statut==='Prévue'?'p':'x';
    dots+='<i class="dt '+cl+'" title="'+esc(fd(x.Date)+' · '+x.Statut)+'"></i>';
  });
  for(var k=ds.length;k<n;k++)dots+='<i class="dt e"></i>';
  var fait=ds.filter(function(x){return x.Statut==='Faite';}).length, ratees=ds.filter(function(x){return x.Statut==='Ratée';}).length, afaire=ds.length-fait-ratees;
  var cible=Math.max(n-ratees,0); // une séance ratée clôt la session une séance plus tôt
  // Contrôle : plus de séances que prévu dans le cycle, ou deux séances le même jour (doublon)
  var seen={}, dup=[];
  ds.forEach(function(x){var d=String(x.Date).slice(0,10);if(seen[d])dup.push(fs(d));seen[d]=1;});
  var warn=(ds.length>n||dup.length)
    ?'<div class="warnline">⚠️ '+ds.length+' séances dans cette session pour '+n+' prévues'+(dup.length?' · <b>doublon le '+esc(dup.join(', '))+'</b>':'')
      +' <a onclick="seeCourse(\''+c.ID+'\',\''+cur.start+'\')">vérifier</a></div>':'';
  var total=daysTo(cur.end)-daysTo(cur.start)||1, pc=Math.min(Math.max((0-daysTo(cur.start))/total,0),1);
  var timeline='<div class="tlb"><div class="bar"><i style="width:'+(pc*100).toFixed(0)+'%"></i><u style="left:'+(pc*100).toFixed(0)+'%"></u></div>'
    +'<div class="bl"><span>'+esc(fs(cur.start))+'</span><span>aujourd\'hui</span><span>'+esc(fs(addDays(cur.end,-1)))+'</span></div></div>';
  var foot;
  if(libre)foot='<div class="okb libre"><span>💝 Tarif libre · '+(s.paye>0?'geste de cette session : <b>'+fmt(s.paye)+'</b>':'aucun geste pour cette session')+'</span><button class="b i" onclick="openGeste(\''+c.ID+'\',\''+cur.start+'\')">+ Geste</button></div>';
  else if(s.offert)foot='<div class="okb"><span>🎁 Session offerte'+(isUnique(c)?' · session unique':' · prochain paiement le <b>'+esc(fs(due))+'</b> ('+dansTxt(due)+')')+'</span></div>';
  else if(s.prix<=0)foot='<div class="okb">Cours gratuit</div>';
  else if(pending)foot='<div class="wait"><span class="pdot"></span><div class="grow"><b>À payer '+fmt(s.reste)+'</b><div class="sub">'
      +(s.paye>0?'payé '+fmt(s.paye)+' sur '+fmt(s.prix):'session '+esc(plabel(cur)))+(od>0?' · depuis '+od+' j':'')+'</div></div>'
      +'<button class="b p" onclick="openPaie(null,\''+c.ID+'\')">Payer</button></div>';
  else if(isUnique(c))foot='<div class="okb"><span>✓ Payé · session unique (aucune session suivante)</span></div>';
  else foot='<div class="okb'+(nDue<=7?' soon':'')+'"><span>✓ Payé · prochain paiement le <b>'+esc(fs(due))+'</b> ('+dansTxt(due)+')</span></div>';
  var last=D.paiements.filter(function(p){return same(p.CoursID,c.ID);})
    .sort(function(a,b){return String(b.Date).slice(0,10)>String(a.Date).slice(0,10)?1:-1;})[0];
  var pP=s.prix?Math.min(s.paye/s.prix,1):1;
  var more='<details class="more"><summary>Détails</summary>'
    +(cur.fee>0?'<div class="sub" style="color:var(--pri)">🧾 Frais d\'inscription '+fmt(cur.fee)+' inclus dans ce premier paiement (une seule fois)</div>':'')
    +(cur.rattrapage?'<div class="sub" style="color:var(--pri)">🏃 Session de rattrapage : '+n+' séance'+(n>1?'s':'')+' puis '+(Number(c.SeancesMois)||8)+' par session</div>':'')
    +(libre?'<div class="bl" style="margin-top:6px"><span>Gestes de la session</span><b>'+(s.paye?fmt(s.paye):'aucun')+'</b></div>'+gestesHtml_(c)
      :'<div class="bl" style="margin-top:6px"><span>Paiement</span><b>'+fmt(s.paye)+' / '+fmt(s.prix)+'</b></div>'
      +'<div class="bar '+(pending?'warn':'ok')+'"><i style="width:'+(pP*100).toFixed(0)+'%"></i></div>')
    +'<div class="tl"><span>Session en cours</span><b>'+esc(plabel(cur))+'</b>'
    +'<span>Dernier paiement</span><b>'+(last?esc(fd(last.Date))+' · '+fmt(last.Montant):'aucun')+'</b>'
    +'<span>Prochaine session</span><b>'+esc(fd(cur.end))+' ('+dansTxt(cur.end)+')</b>'
    +(libre?'<span>Paiement</span><b>tarif libre</b></div>':'<span>Paiement prévu</span><b>le '+esc(fs(due))+' (1er jour de la session)</b></div>')+acts+'</details>';
  return '<div class="card cc '+(pending?'pending':'paid')+'" style="--cc:'+col+'">'
    +head+'<span class="badge '+payBadge(s)+'">'+payBadge(s)+'</span></div>'+infos
    +'<div class="dotsrow"><div class="dots">'+dots+'</div><b>'+fait+' faite'+(fait>1?'s':'')+' · '+afaire+' à faire <span style="font-weight:400;color:var(--mut)">/ '+cible+(ratees?' · '+ratees+' ratée'+(ratees>1?'s':''):'')+'</span></b></div>'+warn
    +timeline+foot+more+'</div>';
}

function vTodo(){
  var t=today();
  function heureDebut(s){
    var h=heureS(s).split('-')[0].trim();
    return h||'99:99'; // sans heure renseignée -> affiché en dernier sur sa journée
  }
  var all=D.seances.filter(function(s){return s.Statut==='Prévue';})
    .sort(function(a,b){
      var da=String(a.Date).slice(0,10), db=String(b.Date).slice(0,10);
      if(da!==db)return da<db?-1:1;
      var ha=heureDebut(a), hb=heureDebut(b);
      return ha<hb?-1:(ha>hb?1:0);
    });
  if(!all.length)return '';
  // Seulement la semaine en cours (dimanche → samedi) + les séances passées non validées ;
  // les semaines suivantes sont masquées et apparaissent au fur et à mesure, semaine par semaine.
  var wk=weekBounds(t);
  var week=all.filter(function(s){return String(s.Date).slice(0,10)<wk.end;});
  var cache=all.length-week.length;
  if(!week.length){
    return '<div class="card"><div class="head"><h2>✅ Séances à venir</h2></div>'
      +'<div class="empty" style="padding:10px 0">Aucune séance restante cette semaine 🎉'+(cache?'<br><span class="sub">'+cache+' séance'+(cache>1?'s':'')+' la semaine prochaine (affichées dès dimanche)</span>':'')+'</div></div>';
  }
  return '<div class="card"><div class="head"><h2>✅ Séances de la semaine</h2><span class="badge Prévue">'+week.length+'</span></div>'
    +'<div class="sub">Coche la case quand la séance a eu lieu. Pour une séance passée non faite, clique sur « Non faite » pour la décaler.</div>'
    +week.map(function(s){
      var c=crs(s.CoursID), d=String(s.Date).slice(0,10), late=d<=t;
      return '<div class="row"><label class="chk grow" style="margin:0"><input type="checkbox" onchange="setStat(\''+s.ID+'\',\'Faite\')">'
        +'<span><span style="font-size:16px;font-weight:700">'+subjIconBig(c.Matiere)+' '+esc(cname(c))+'</span><br><span class="sub">'+esc(fd(s.Date))+choraireS(s)+'</span></span></label>'
        +(late?'<button class="b i" onclick="openReport(\''+s.ID+'\')">↪ Non faite</button> <button class="b i" title="Ratée : absent·e, non rattrapable" onclick="setStat(\''+s.ID+'\',\'Ratée\')">✕ Ratée</button>':'<span class="badge Prévue">à venir</span>')+'</div>';
    }).join('')
    +(cache?'<div class="sub" style="text-align:center;padding-top:10px">+ '+cache+' séance'+(cache>1?'s':'')+' les semaines suivantes (affichées dès dimanche)</div>':'')+'</div>';
}

// Liste des cours classée par NOM d'enfant (ordre alphabétique), puis par matière.
function coursOptions(sel){
  var groups={};
  D.cours.forEach(function(c){(groups[c.EnfantID]=groups[c.EnfantID]||[]).push(c);});
  var ids=Object.keys(groups).sort(function(a,b){return String(enf(a).Nom).localeCompare(String(enf(b).Nom),'fr',{sensitivity:'base'});});
  return ids.map(function(id){
    var list=groups[id].slice().sort(function(a,b){return String(a.Matiere).localeCompare(String(b.Matiere),'fr',{sensitivity:'base'});});
    return '<optgroup label="'+esc(enf(id).Nom)+'">'+list.map(function(c){
      return '<option value="'+c.ID+'"'+(same(c.ID,sel)?' selected':'')+'>'+esc(c.Matiere+(c.Prof?' ('+c.Prof+')':''))+'</option>';
    }).join('')+'</optgroup>';
  }).join('');
}

// Ordre d'affichage des séances : les plus proches d'aujourd'hui d'abord
// (à venir par ordre chronologique, puis les passées de la plus récente à la plus ancienne).
function cmpProche(a,b){
  var t=today(), da=String(a.Date).slice(0,10), db=String(b.Date).slice(0,10);
  var fa=da>=t, fb=db>=t;
  if(fa!==fb)return fa?-1:1;
  if(da!==db)return fa?(da<db?-1:1):(da<db?1:-1);
  var ha=String(heureS(a)||'99:99').split('-')[0].trim(), hb=String(heureS(b)||'99:99').split('-')[0].trim();
  return ha<hb?-1:ha>hb?1:0;
}

// Synthèse des dépenses (paiements aux profs) par mois du calendrier : mois × enfant, puis par cours.
function moisLabel(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString(I18N.locale(),{month:'long',year:'numeric'});}
function vDepenses(){
  if(!D.paiements.length)return '';
  var mois={}, tot=0, parCours={}, enfs={};
  D.paiements.forEach(function(x){
    var m=String(x.Date).slice(0,7), c=crs(x.CoursID), a=Number(x.Montant)||0;
    var e=c.EnfantID;enfs[e]=1;
    var aucun=String(x.Mode||'')==='Aucun geste';
    var o=mois[m]=mois[m]||{t:0,n:0,e:{}};o.t+=a;if(!aucun)o.n++;o.e[e]=(o.e[e]||0)+a;
    tot+=a;
    var pc=parCours[x.CoursID]=parCours[x.CoursID]||{t:0,n:0,last:''};pc.t+=a;if(!aucun)pc.n++;
    var d=String(x.Date).slice(0,10);if(d>pc.last)pc.last=d;
  });
  var ids=Object.keys(enfs).sort(function(a,b){return String(enf(a).Nom).localeCompare(String(enf(b).Nom),'fr',{sensitivity:'base'});});
  var ms=Object.keys(mois).sort().reverse();
  var max=Math.max.apply(null,ms.map(function(m){return mois[m].t;}).concat([1]));
  var cm=today().slice(0,7);
  var head='<tr><th>Mois</th>'+ids.map(function(i){return '<th>'+esc(enf(i).Nom)+'</th>';}).join('')+'<th>Total</th></tr>';
  var body=ms.map(function(m){
    var o=mois[m];
    return '<tr'+(m===cm?' class="cur"':'')+'><td><span style="text-transform:capitalize">'+esc(moisLabel(m))+'</span> <span class="sub">· '+o.n+' paiement'+(o.n>1?'s':'')+'</span></td>'
      +ids.map(function(i){return '<td>'+(o.e[i]?fmt(o.e[i]):'<span class="sub">—</span>')+'</td>';}).join('')
      +'<td><b>'+fmt(o.t)+'</b><div class="dbar"><i style="width:'+(o.t/max*100).toFixed(0)+'%"></i></div></td></tr>';
  }).join('');

function verCmp(a,b){
  var x=String(a||'0').split('.').map(Number), y=String(b||'0').split('.').map(Number);
  for(var i=0;i<Math.max(x.length,y.length);i++){var d=(x[i]||0)-(y[i]||0);if(d)return d<0?-1:1;}
  return 0;
}
function serveurPerime(){

}

function telechargerSauvegarde_(b,prefix){
  var d=new Date(),p=function(x){return (x<10?'0':'')+x;};
  var nom=(prefix||'darsy-sauvegarde')+'-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json';
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(b,null,1)],{type:'application/json'}));
  a.download=nom;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
  return nom;
}
function exportBase(){
  busy_(true);
  return apiCall('exporterBase',[]).then(function(b){busy_(false);var nom=telechargerSauvegarde_(b);alert('Sauvegarde téléchargée : '+nom);return b;},
    function(e){busy_(false);alert(e.message||e);});
}
function appliquerBase_(fn,args,msg){
  document.getElementById('app').innerHTML='<div class="empty">'+msg+'</div>';

    function(e){alert(e.message||e);boot();});
}
function importBase(inp){
  var f=inp.files&&inp.files[0];inp.value='';
  if(!f)return;
  var r=new FileReader();
  r.onerror=function(){alert('Lecture du fichier impossible.');};
  r.onload=function(){
    var b;
    try{b=JSON.parse(r.result);}catch(e){alert('Fichier illisible : ce n\'est pas une sauvegarde Darsy+.');return;}
    if(!b||(b.app!=='darsy'&&b.app!=='coursup')||!b.tables||!Array.isArray(b.tables.Enfants)||!Array.isArray(b.tables.Cours)||!Array.isArray(b.tables.Sessions)||!Array.isArray(b.tables.Versements)||!Array.isArray(b.tables.Ecole)){alert('Ce fichier n\'est pas une sauvegarde Darsy+ valide.');return;}
    var t=b.tables;
    if(!confirm('Restaurer la sauvegarde du '+String(b.date||'').slice(0,10)+' ?\n\n'+t.Enfants.length+' enfant(s), '+t.Cours.length+' cours, '+t.Sessions.length+' séance(s), '+t.Versements.length+' paiement(s).\n\nTout le contenu actuel sera REMPLACÉ (une copie de sécurité est téléchargée avant).'))return;
    busy_(true);
    apiCall('exporterBase',[]).then(function(cur){
      busy_(false);
      telechargerSauvegarde_(cur,'darsy-avant-import');
      return appliquerBase_('importerBase',[b],'Restauration en cours…');
    },function(e){busy_(false);alert('Copie de sécurité impossible, import annulé : '+(e.message||e));});
  };
  r.readAsText(f);
}
function viderBase(){
  if(!confirm('Vider TOUTE la base (enfants, cours, séances, paiements, lycée) ? Une copie de sécurité sera téléchargée avant.'))return;
  var t=prompt('Pour confirmer, tape VIDER en majuscules :');
  if(t!=='VIDER'){if(t!==null)alert('Annulé : mot de confirmation incorrect.');return;}
  busy_(true);

    busy_(false);

}

var SYNC_NETT=0;
function nettMsg_(){return SYNC_NETT?'\n\n🧹 '+SYNC_NETT+' événement(s) passé(s) retiré(s) de l\'agenda (l\'historique reste dans l\'appli).':'';}
function syncLoop_(action,total,onDone,echecs){
  echecs=echecs||[];
  apiCall(action,[]).then(function(res){
    total+=(res&&res.n)||0;SYNC_NETT+=(res&&res.nettoyes)||0;
    if(res&&res.echecs&&res.echecs.length)echecs=echecs.concat(res.echecs);
    if(res&&res.more){
      document.getElementById('app').innerHTML='<div class="empty">Synchronisation en cours… '+total+' créé(s) jusqu\'ici.</div>';
      syncLoop_(action,total,onDone,echecs);
    }else{
      onDone(total,echecs);
    }
  }).catch(function(e){
    document.getElementById('app').style.opacity=1;
    alert((e.message||e)+(total?(' ('+total+' créé(s) avant l\'erreur.)'):''));
    boot();
  });
}
function echecsMsg_(echecs){
  if(!echecs||!echecs.length)return'';
  return '\n\n⚠️ '+echecs.length+' invitation(s) n\'ont pas pu être envoyées :\n- '+echecs.join('\n- ');
}

    document.getElementById('app').style.opacity=1;
    var m='E-mail du chauffeur : '+r.email+'\nCours avec « 🚕 Prévenir le chauffeur » : '+r.coursCoches+'\nSéances prévues dans les 30 jours : '+r.seancesAVenir+'\nInvitations déjà créées : '+r.invitationsDejaCreees+'\n\n';

/** Réglage rapide : les cours sont regroupés (même matière, même prof, mêmes jours et même horaire = UNE ligne pour tous les enfants). */
function reglageRapide_(){
  if(!D.cours.length)return '';
  var g={},ordre=[];
  D.cours.forEach(function(c){
    var j=String(c.Jours||'').split(',').map(function(x){return x.trim();}).filter(Boolean).sort().join(',');
    var k=subjNorm(c.Matiere)+'|'+String(c.Prof||'').trim().toLowerCase()+'|'+j+'|'+String(c.Heure||'').trim();
    if(!g[k]){g[k]={cs:[],mat:c.Matiere,prof:c.Prof,heure:c.Heure,jours:j};ordre.push(k);}
    g[k].cs.push(c);
  });
  var rows=ordre.map(function(k,i){
    var x=g[k],ids=x.cs.map(function(c){return c.ID;}).join(',');
    var noms=x.cs.map(function(c){return (D.enfants.find(function(e){return same(e.ID,c.EnfantID);})||{}).Nom||'';}).filter(function(v,i,a){return v&&a.indexOf(v)===i;});
    var tous=x.cs.every(function(c){return String(c.Chauffeur)==='1';});
    var lieux=x.cs.map(function(c){return String(c.Lieu||'').trim();}).filter(function(v,i,a){return a.indexOf(v)===i;});
    return '<div class="qrow" data-ids="'+ids+'">'
      +'<div style="font-size:14.5px"><b dir="auto">'+esc(noms.join(' & '))+'</b> · '+subjIcon(x.mat)+' '+esc(x.mat)+(x.prof?' · '+esc(x.prof):'')+'</div>'
      +'<div class="sub">'+esc(x.jours.replace(/,/g,' · '))+(x.heure?' · '+esc(x.heure):'')+'</div>'
      +'<label class="chk" style="margin:6px 0 0"><input type="checkbox" class="q-taxi"'+(tous?' checked':'')+' onchange="reglerGroupe_(this,\'Chauffeur\')"> 🚕 Prévenir le chauffeur</label>'
      +'<input class="q-lieu" dir="auto" value="'+esc(lieux.length===1?lieux[0]:'')+'" placeholder="'+(lieux.length>1?'Lieux différents : écris-en un pour tous':'Emplacement (adresse, salle ou lien Maps)')+'" onchange="reglerGroupe_(this,\'Lieu\')"></div>';
  }).join('');
  return '<details class="card kidc" '+(OPEN.rapide?'open':'')+' ontoggle="OPEN.rapide=this.open"><summary>⚡ Réglage rapide<span class="sub" style="font-weight:400">· un seul geste pour plusieurs enfants</span></summary>'
    +'<div class="sub" style="margin:0 0 6px">Les cours identiques (même matière, même prof, mêmes jours, même horaire) sont regroupés : une coche ou un lieu s\'applique à tous les enfants concernés, et une seule alarme est créée pour eux dans l\'agenda.</div>'+rows+'</details>';
}
function reglerGroupe_(el,champ){
  var ids=el.closest('.qrow').dataset.ids.split(',');
  var val=champ==='Chauffeur'?(el.checked?1:0):el.value.trim();
  var o={};o[champ]=val;
  call('reglerCours',ids,o);
}
function saveCoursForm(btn){
  var c=btn.closest('.course');
  var ancien=crs(c.dataset.id), nouveauxJours=[].slice.call(c.querySelectorAll('.c-jour:checked')).map(function(x){return x.value;}).sort().join(',');
  var changeJours=nouveauxJours!==String(ancien.Jours||'').split(',').map(function(x){return x.trim();}).filter(Boolean).sort().join(',');
  if(changeJours){
    if(verCmp(D.version,'2026.10.04.14')<0)alert('⚠️ Le serveur n\'est pas à jour : les séances à venir ne seront PAS reprogrammées automatiquement. Recolle le dernier Code.gs dans Apps Script (Gérer les déploiements → Nouvelle version).');
    else showToast('Jours modifiés : séances à venir reprogrammées',null,null,5000);
  }
  var jours=[].slice.call(c.querySelectorAll('.c-jour:checked')).map(function(x){return x.value;}).join(',');
  // Séances prévues qui tombent un jour qui n'est plus au programme : on propose de les retirer (les séances décalées volontairement restent)
  var ok=jours.split(',').filter(Boolean).map(function(d){return DAYS.indexOf(d);}), tj=today(), purger=false;
  var hors=ok.length?D.seances.filter(function(x){
    if(!same(x.CoursID,c.dataset.id)||x.Statut!=='Prévue'||String(x.Date).slice(0,10)<tj||/^reportée du/.test(String(x.Note||'')))return false;
    var d=String(x.Date).slice(0,10).split('-').map(Number);return ok.indexOf(new Date(d[0],d[1]-1,d[2]).getDay())<0;}):[];
  if(hors.length){
    purger=changeJours||confirm(hors.length+' séance(s) prévue(s) tombent un jour qui n\'est plus au programme ('+hors.slice(0,3).map(function(x){return fs(String(x.Date).slice(0,10));}).join(', ')+(hors.length>3?'…':'')+'). Les supprimer pour suivre le programme ?');
  }
  call('saveCours',{ID:c.dataset.id,Purger:purger?1:0,Matiere:c.querySelector('.c-mat').value.trim(),Prof:c.querySelector('.c-prof').value.trim(),
    PrixMois:Number(c.querySelector('.c-prix').value)||0,SeancesMois:Number(c.querySelector('.c-nb').value)||8,Rattrapage:Number(c.querySelector('.c-ratt').value)||0,PrixRattrapage:Number(c.querySelector('.c-prixr').value)||0,FraisInscription:Number(c.querySelector('.c-frais').value)||0,TarifLibre:c.querySelector('.c-libre').checked?1:0,SessionUnique:c.querySelector('.c-unique').checked?1:0,Chauffeur:c.querySelector('.c-taxi').checked?1:0,Jours:jours,
    Heure:c.querySelector('.c-heure').value.trim(),Lieu:c.querySelector('.c-lieu').value.trim()});
  // jours ou horaire changés : l'agenda est mis à jour tout de suite (anciens événements retirés par le serveur, nouveaux créés ici)
  if(changeJours||String(ancien.Heure||'').trim()!==c.querySelector('.c-heure').value.trim())Q=Q.then(syncAuto_);
}
function syncAuto_(){
  var tot=0,nett=0;
  return new Promise(function(ok){
    (function pas(){
      apiCall('syncCalendrierManuel',[]).then(function(r){
        tot+=(r&&r.n)||0;nett+=(r&&r.nettoyes)||0;
        if(r&&r.more){pas();return;}
        showToast('Agenda mis à jour'+(tot?' : '+tot+' événement(s) créé(s)':''),null,null,4000);ok();
      }).catch(function(){ok();}); // pas d'agenda relié ou hors ligne : sans importance ici, « Synchroniser maintenant » reste disponible
    })();
  });
}
function setStat(id,st,trajet){
  closeM();
  var x=seance(id), c=x?crs(x.CoursID):null;
  // Cours avec chauffeur : à la validation, on confirme qui a ramené les enfants (le chauffeur n'est payé que s'il les a ramenés)
  if(st==='Faite'&&trajet===undefined&&c&&String(c.Chauffeur)==='1'&&D.chauffeur){askTrajet_(id);return;}
  var o={ID:id,Statut:st};
  if(st==='Faite'&&trajet!==undefined)o.Trajet=trajet;
  if(st!=='Faite')o.Trajet='';
  if(x){x.Statut=st;if('Trajet' in o)x.Trajet=o.Trajet;IDX=null;CY={};render();} // affichage immédiat, le serveur confirme ensuite
  callQ_('saveSeance',[o],true);
}

}

/** Cours déjà configurés, regroupés (même matière, prof, jours, horaire) : pour reprendre leurs réglages. */
function coursModeles_(sauf){
  var g={},out=[];
  D.cours.forEach(function(c){
    if(sauf&&same(c.EnfantID,sauf))return;
    var j=String(c.Jours||'').split(',').map(function(x){return x.trim();}).filter(Boolean).sort().join(',');
    var k=subjNorm(c.Matiere)+'|'+String(c.Prof||'').trim().toLowerCase()+'|'+j+'|'+String(c.Heure||'').trim();
    if(!g[k]){g[k]={c:c,enfants:[]};out.push(g[k]);}
    g[k].enfants.push(enf(c.EnfantID).Nom);
  });
  return out;
}
function coursCopieSelect_(p){
  var m=coursModeles_();
  if(!m.length)return '';
  return '<label>Reprendre les réglages d\'un cours existant</label><select onchange="copierCours_(\''+p+'\',this.value)"><option value="">— Reprendre les réglages de… —</option>'
    +m.map(function(x){return '<option value="'+x.c.ID+'">'+esc(x.enfants.join(' & '))+' · '+esc(x.c.Matiere)+(x.c.Prof?' · '+esc(x.c.Prof):'')+'</option>';}).join('')+'</select>';
}
function copierCours_(p,id){
  if(!id)return;
  var c=crs(id), set=function(k,val){var e=document.getElementById(p+k);if(e)e.value=val==null?'':val;}, chk=function(k,val){var e=document.getElementById(p+k);if(e)e.checked=!!val;};
  set('mat',c.Matiere);set('prof',c.Prof);set('prix',c.PrixMois);set('nb',c.SeancesMois||8);set('frais',c.FraisInscription||'');
  set('heure',c.Heure);set('lieu',c.Lieu);
  chk('unique',isUnique(c));chk('libre',isLibre(c));chk('taxi',String(c.Chauffeur)==='1');
  var j=String(c.Jours||'').split(',').map(function(x){return x.trim();});
  [].slice.call(document.querySelectorAll('.'+p+'jour')).forEach(function(x){x.checked=j.indexOf(x.value)>=0;});
}
function coursPayload_(p,eid){
  var jours=[].slice.call(document.querySelectorAll('.'+p+'jour:checked')).map(function(x){return x.value;}).join(',');
  return {EnfantID:eid,Matiere:v(p+'mat').trim(),Prof:v(p+'prof').trim(),PrixMois:Number(v(p+'prix'))||0,SeancesMois:Number(v(p+'nb'))||8,Rattrapage:Number(v(p+'ratt'))||0,PrixRattrapage:Number(v(p+'prixr'))||0,FraisInscription:Number(v(p+'frais'))||0,
    TarifLibre:document.getElementById(p+'libre').checked?1:0,SessionUnique:document.getElementById(p+'unique').checked?1:0,Chauffeur:document.getElementById(p+'taxi').checked?1:0,Jours:jours,Heure:v(p+'heure').trim(),Lieu:v(p+'lieu').trim()};
}

function openPayerChauffeur_(){

  var finMois=iso(new Date(p[0],p[1],0)), debMois=t.slice(0,7)+'-01', debPrec=iso(new Date(p[0],p[1]-2,1)), finPrec=iso(new Date(p[0],p[1]-1,0));

    +'<div class="actions"><button class="b p" id="pc-ok" disabled onclick="payerPc_()">Payer</button><button class="b" onclick="closeM()">Annuler</button></div>');

function pastillesChauffeur_(l){
  if(!l||!l.length)return '';
  var fait=l.filter(function(p){return p.etat==='paye'||p.etat==='fait';}).length, manque=l.filter(function(p){return p.etat==='manque';}).length, prevu=l.filter(function(p){return p.etat==='prevu';}).length;

    return '<i class="dt '+cl+'" title="'+esc(fd(p.date)+' · '+lib)+'"></i>';}).join('');
  return '<div class="dotsrow" style="margin:6px 0"><div class="dots">'+dots+'</div><b>'+fait+' fait'+(fait>1?'s':'')+(manque?' · '+manque+' non effectué'+(manque>1?'s':''):'')+' · '+prevu+' à faire</b></div>';

  var eid=WZ.ids[WZ.idx], debut=today(), jobs=[];

function doLogin_(ev){
  ev.preventDefault();
  var b=document.getElementById('l-ok');b.disabled=true;authMsg_('');
  var rester=document.getElementById('l-rester').checked;

function doSignup_(ev){

function quitterSupport_(){
  var back='';try{back=sessionStorage.getItem('darsy_sup_back')||'';sessionStorage.removeItem('darsy_sup_back');}catch(e){}

function monter_(el,html){
  var tmp=document.createElement('div');tmp.innerHTML=html;
  var scripts=[].slice.call(tmp.querySelectorAll('script'));
  scripts.forEach(function(x){x.parentNode.removeChild(x);});
  el.innerHTML=tmp.innerHTML;
  scripts.forEach(function(x){var n=document.createElement('script');n.text=x.textContent;document.body.appendChild(n);});
}

/** À la première connexion, si le compte porte encore un nom par défaut (« Ma famille », « compte d'origine »), on demande le vrai nom. */
function proposerNom_(){
  if(!ME||LEGACY_MODE||ME.membre||ME.chauffeur||ME.support||ME.Role!=='client')return;
  if(!(/compte d.origine/i.test(ME.Nom||'')||ME.Nom==='Ma famille'))return;

function erreurReseau_(e){
  chrome_(false);
  appShell_().innerHTML='<div class="card"><div class="empty">Erreur : '+esc(e.message||e)+'<div class="actions" style="justify-content:center"><button class="b" onclick="boot()">Réessayer</button>'
    +(LEGACY_MODE?'<button class="b" onclick="changeApiUrl()">Changer l\'URL de l\'API</button>':'')+'</div></div></div>';
}
function loadApp(){
  chrome_(true);
  var cached=readCache_();
  if(cached){setD(cached);render();}
  else document.getElementById('app').innerHTML='<div class="empty">Chargement…</div>';
  apiCall('getData',[]).then(function(d){setD(d);cacheData();safeRender();})
    .catch(function(e){
      if(e.licence){boot();return;}
      if(!TOKEN&&!LEGACY_MODE)return; // la session a expiré : l'écran de connexion est déjà affiché
      if(cached)return; // hors ligne : on garde la version en cache
      erreurReseau_(e);
    });
}
function boot(){
  majSortie_();
  if(REINIT){showReinit(REINIT);return;}
  if(INVIT){showInvitation(INVIT);return;}
  if(LEGACY_MODE){loadApp();return;}
  if(!TOKEN){
    // Pas de session : le serveur gère-t-il les comptes ? (ancien serveur => fonctionnement d'avant, sans connexion)
    apiCall('modeInscription',[]).then(function(){showLogin('');},function(e){
      if(/Action API inconnue/.test(e.message||'')){LEGACY_MODE=true;majSortie_();loadApp();return;}
      erreurReseau_(e);
    });
    return;
  }
  apiCall('moi',[]).then(function(m){
    ME=m;majSupport_();
    if(m.Role==='admin')showAdmin();
    else if(m.Role==='chauffeur')showChauffeur();
    else if(m.Etat!=='actif'&&!m.support)showEtat(m);
    else{loadApp();setTimeout(proposerNom_,1200);}
  },function(e){
    if(/Action API inconnue/.test(e.message||'')){LEGACY_MODE=true;majSortie_();loadApp();return;}
    if(!TOKEN)return; // session expirée : connexion déjà affichée
    var cached=readCache_();
    if(cached){chrome_(true);setD(cached);render();return;} // hors ligne
    erreurReseau_(e);
  });
}

var AIDE_TAB='famille';
function aideOnglets_(){
  var t=[['famille','Utiliser Darsy+']];
  if(ME&&ME.Role==='admin')t.push(['admin','Administrateur']);
  t.push(['faq','Questions fréquentes']);

function openAide(onglet){
  var ov=document.getElementById('aide-ov');
  if(!ov){ov=document.createElement('div');ov.id='aide-ov';ov.className='aide-ov';document.body.appendChild(ov);}
  AIDE_TAB=onglet||(ME&&ME.Role==='admin'?'admin':'famille');
  ov.style.display='block';document.body.style.overflow='hidden';
  aideRender_();
  ov.scrollTop=0;
}
function closeAide(){var ov=document.getElementById('aide-ov');if(ov)ov.style.display='none';document.body.style.overflow='';}
function aideRender_(){
  var ov=document.getElementById('aide-ov');
  var h='<div class="aide-top"><h2>❓ Aide</h2><button onclick="closeAide()">Fermer ✕</button></div>';
  h+='<div class="aide-tabs">'+aideOnglets_().map(function(t){return '<button class="'+(AIDE_TAB===t[0]?'on':'')+'" onclick="AIDE_TAB=\''+t[0]+'\';aideRender_();document.getElementById(\'aide-ov\').scrollTop=0">'+t[1]+'</button>';}).join('')+'</div><div class="aide-body">';
  var A=AIDE_L[I18N.lang]||AIDE; // le contenu de l'aide est déjà traduit : pas de traduction automatique dessus
  h+='<div data-notr>';
  if(AIDE_TAB==='faq'){
    h+='<div class="card aide-faq">'+A.faq.map(function(q){return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>';}).join('')+'</div>';
  }else{
    h+=A[AIDE_TAB].map(function(st,i){
      return '<div class="card aide-step'+(st.img?' img':'')+'"><div><h3><span class="n">'+(i+1)+'</span>'+st.t+'</h3>'+st.p.map(function(x){return '<p>'+x+'</p>';}).join('')+'</div>'
        +(st.img?'<img src="'+((AIDE_TAB==='famille'&&I18N.lang!=='fr')?st.img.replace('aide/','aide/'+I18N.lang+'/'):st.img)+'" alt="'+esc(st.t)+'" loading="lazy" onerror="this.style.display=\'none\'">':'')+'</div>';}).join('');
  }
  ov.innerHTML=h+'</div></div>';
}

(function(){
  var DISMISS_KEY='cours_install_dismissed_at', SNOOZE_DAYS=14;
  function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
  function dismissedRecently(){
    var raw=localStorage.getItem(DISMISS_KEY);if(!raw)return false;
    return (Date.now()-Number(raw))/86400000<SNOOZE_DAYS;
  }
  function makeBanner(){
    var el=document.createElement('div');
    el.className='install';
    el.id='install-banner';
    document.body.insertBefore(el, document.querySelector('main'));
    return el;
  }
  function show(mode, promptFn){
    if(isStandalone()||dismissedRecently())return;
    var el=makeBanner();
    var isIOS=mode==='ios';
    el.style.display='flex';
    el.innerHTML='<span class="em">📲</span><div class="txt"><b>Installer sur l\'écran d\'accueil</b>'
      +(isIOS?'Appuyez sur Partager (⬆️) puis « Sur l\'écran d\'accueil ».':'Accès rapide, en plein écran, comme une vraie appli.')+'</div>'
      +(isIOS?'':'<button class="go" id="install-go">Installer</button>')
      +'<button class="close" id="install-close">✕</button>';
    document.getElementById('install-close').onclick=function(){
      localStorage.setItem(DISMISS_KEY,String(Date.now()));
      el.style.display='none';
    };
    if(!isIOS){
      document.getElementById('install-go').onclick=function(){
        if(promptFn)promptFn();
        el.style.display='none';
      };
    }
  }
  try{
    if(isStandalone()){/* déjà installée */}
    else if(/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream){
      show('ios');
    }else{
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        __deferredPrompt=e;
        show('android', function(){e.prompt();});
      });
    }
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  }catch(e){}
})();
</script>
</body>
</html>
